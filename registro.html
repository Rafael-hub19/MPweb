<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="public/assets/css/_variables.css">
    <link rel="stylesheet" href="public/assets/css/styles.css">
    <link rel="stylesheet" href="public/assets/css/registro.css">
</head>
<body>

    <!-- Logo -->
    <div class="logo-container">
        <img src="public/assets/img/logo-ceti.png" alt="Logo CETI" class="logo-img">
    </div>

    <!-- Botón regresar -->
    <a href="index.html" class="back-button">← Regresar al inicio</a>

    <!-- Partículas de fondo -->
    <canvas id="particles-canvas"></canvas>

    <!-- Contenido principal -->
    <main class="registro-wrapper">
        <div class="registro-container animate-fade-in">

            <!-- Header del formulario -->
            <div class="registro-header">
                <div class="registro-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M19 10l2 2 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="check-path"/>
                    </svg>
                </div>
                <h1 class="registro-title">Registro de Usuario</h1>
                <p class="registro-subtitle">Crea tu cuenta para acceder al sistema</p>
                <div class="divider"></div>
            </div>

            <!-- Formulario -->
            <form class="registro-form" action="registro.php" method="POST" id="registro-form" novalidate>

                <!-- Nombre -->
                <div class="form-group" id="group-nombre">
                    <label class="form-label" for="nombre">
                        <span class="label-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                            </svg>
                        </span>
                        Nombre completo
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            class="form-input"
                            placeholder="Ej: Juan Pérez García"
                            autocomplete="name"
                            required
                        >
                        <span class="input-status"></span>
                    </div>
                    <span class="form-error" id="error-nombre"></span>
                </div>

                <!-- Correo -->
                <div class="form-group" id="group-email">
                    <label class="form-label" for="email">
                        <span class="label-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M2 8l10 6 10-6"/>
                            </svg>
                        </span>
                        Correo electrónico
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="correo@ejemplo.com"
                            autocomplete="email"
                            required
                        >
                        <span class="input-status"></span>
                    </div>
                    <span class="form-error" id="error-email"></span>
                </div>

                <!-- Contraseña -->
                <div class="form-group" id="group-password">
                    <label class="form-label" for="password">
                        <span class="label-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <rect x="5" y="11" width="14" height="10" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                        </span>
                        Contraseña
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            placeholder="Mínimo 8 caracteres"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="toggle-pwd" aria-label="Mostrar contraseña">
                            <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                        <span class="input-status"></span>
                    </div>
                    <!-- Barra de fortaleza -->
                    <div class="strength-bar">
                        <div class="strength-track">
                            <div class="strength-fill" id="strength-fill"></div>
                        </div>
                        <span class="strength-label" id="strength-label"></span>
                    </div>
                    <span class="form-error" id="error-password"></span>
                </div>

                <!-- Confirmar Contraseña -->
                <div class="form-group" id="group-confirm">
                    <label class="form-label" for="confirm_password">
                        <span class="label-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M9 12l2 2 4-4"/>
                                <rect x="5" y="11" width="14" height="10" rx="2"/>
                                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            </svg>
                        </span>
                        Confirmar contraseña
                    </label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-input"
                            placeholder="Repite tu contraseña"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="toggle-confirm" aria-label="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                        <span class="input-status"></span>
                    </div>
                    <span class="form-error" id="error-confirm"></span>
                </div>

                <!-- Botón submit -->
                <button type="submit" class="btn-registro" id="btn-submit">
                    <span class="btn-text">Crear Cuenta</span>
                    <span class="btn-loader hidden">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                        </svg>
                    </span>
                    <span class="btn-arrow">&#8594;</span>
                </button>

            </form>

        </div>
    </main>

    <script src="public/assets/js/registro.js"></script>
</body>
</html>
